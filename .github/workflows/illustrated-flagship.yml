name: 旗艦插畫生成（測試）

on:
  workflow_dispatch:
    inputs:
      compose_only:
        description: "只重疊文字（沿用現有插畫、不重新生圖）填 true；要新插畫則留空"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  flagship:
    runs-on: ubuntu-latest
    steps:
      - name: 取出專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright + 瀏覽器核心
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 生成旗艦插畫（Gemini 生圖 + 疊字）
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          COMPOSE_ONLY: ${{ github.event.inputs.compose_only }}
        run: python scripts/flagship_gen.py

      - name: 把成品與插畫 commit 上 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/flagship/ flagship/_art.png
          git commit -m "旗艦插畫 $(date -u +%Y-%m-%d %H:%M)" || echo "沒有新成品"
          git push
