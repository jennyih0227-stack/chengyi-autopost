name: 旗艦插畫生成（測試）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flagship:
    runs-on: ubuntu-latest
    steps:
      - name: 取出專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright + 瀏覽器核心
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 生成旗艦插畫（Gemini 生圖 + 疊字）
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scripts/flagship_gen.py

      - name: 把成品 commit 上 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/flagship/
          git commit -m "旗艦插畫測試 $(date -u +%Y-%m-%d)" || echo "沒有新成品"
          git push
