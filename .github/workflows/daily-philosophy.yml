name: 每日哲學四平台發布

on:
  schedule:
    # cron 用 UTC。台灣 = UTC+8。台灣早上 07:00 → UTC 前一天 23:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      override_date:
        description: "強制指定日期 (YYYY-MM-DD)，留空則用今天"
        required: false
        default: ""
      only:
        description: "只發指定平台（逗號分隔，如 line 或 line,fb），留空發全部"
        required: false
        default: ""

permissions:
  contents: write        # 需要把當日卡片 commit 回 repo，供 GitHub Pages 當圖床

jobs:
  philosophy:
    runs-on: ubuntu-latest
    steps:
      - name: 取出專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright + 瀏覽器核心
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 生成哲學內容並渲染卡片
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OVERRIDE_DATE: ${{ github.event.inputs.override_date }}
        run: python scripts/philosophy_gen.py

      - name: 把當日卡片 commit 上 GitHub（圖床）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/daily/
          git commit -m "每日哲學卡 $(date -u +%Y-%m-%d)" || echo "沒有新卡片，略過 commit"
          git push

      - name: 四平台發布
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/philosophy_post.py
